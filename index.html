<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
    <body>
    <h1 id="title">Task Tracker</h1>
    <p class="subtitle">A tiny app for learning Git, environments and CI/CD.</p>

    <form id="new-task">
      <input id="task-input" type="text" placeholder="What needs doing?" required />
      <button type="submit">Add</button>
    </form>
    <p id="count"></p>

    <ul id="tasks"></ul>

    <script src="app.js"></script>
  </body>
</html>
